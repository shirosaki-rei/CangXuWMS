<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMS 仓储管理系统 · 高保真原型 V2.1（AI 增强）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#1891ff;
    --blue-d:#0d7ae0;
    --line:#e5e5e5;
    --thead:#f7f7f7;
    --crumb:#eff7fa;
    --text:#333;
    --muted:#999;
    --sub:#f5f5f5;
  }
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#eceff3;color:var(--text);overflow:hidden;
  }

  /* ---------- 外壳 ---------- */
  .shell{display:flex;height:100vh}
  .tree{
    width:236px;flex:0 0 236px;background:#fff;border-right:1px solid #dde2e8;
    display:flex;flex-direction:column;
  }
  .tree-hd{
    height:46px;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;border-bottom:1px solid #e8ecf1;font-size:12px;color:#666;
    letter-spacing:.5px;
  }
  .tree-hd b{font-size:13px;color:#222;font-weight:600}
  .tree-bd{flex:1;overflow:auto;padding:6px 0 30px}
  .node{font-size:12px;color:#555;cursor:pointer;user-select:none}
  .node.lv1{padding:7px 14px 7px 12px;font-weight:600;color:#333;display:flex;align-items:center;gap:6px}
  .node.lv1:hover{background:#f7f9fb}
  .node.lv2{padding:6px 14px 6px 34px;color:#666}
  .node.lv2:hover{background:#f4f8fd;color:#1891ff}
  .node.lv3{padding:5px 14px 5px 52px;color:#777}
  .node.lv3:hover{background:#f4f8fd;color:#1891ff}
  .node.active{background:#e8f3ff;color:var(--blue);font-weight:600}
  .node .tri{font-size:9px;color:#aaa;transition:transform .15s;display:inline-block;width:10px}
  .node.closed .tri{transform:rotate(-90deg)}
  .grp-body.hide{display:none}

  .stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .stage-hd{
    height:46px;flex:0 0 46px;background:#fff;border-bottom:1px solid #dde2e8;
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  }
  .stage-hd .t{font-size:13px;color:#333;font-weight:600}
  .stage-hd .t span{font-weight:400;color:#9aa4af;margin-left:8px;font-size:12px}
  .stage-hd .hint{font-size:11px;color:#a6b0ba}
  .stage-bd{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}

  /* ---------- PC 画布 ---------- */
  .pc{width:1280px;max-width:100%;min-width:0;background:#fff;box-shadow:0 6px 28px rgba(28,50,80,.14);flex:0 1 auto}
  .topbar{
    height:66px;display:flex;align-items:center;color:#fff;
    background:linear-gradient(90deg,#0b76dc 0%,#1687f5 10%,#1891ff 100%);
  }
  .logo{
    width:140px;flex:0 0 140px;padding-left:16px;font-size:17px;font-weight:700;
    letter-spacing:.3px;white-space:nowrap;
  }
  .mainnav{display:flex;align-items:center;height:100%;font-size:13px}
  .mainnav a{
    color:#fff;text-decoration:none;padding:0 15px;height:100%;display:flex;align-items:center;white-space:nowrap;
    opacity:.95;cursor:pointer;white-space:nowrap;
  }
  .mainnav a:hover{opacity:1;background:rgba(255,255,255,.12)}
  .mainnav a.on{background:rgba(255,255,255,.18);font-weight:600;opacity:1}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;padding-right:16px;font-size:12px;opacity:.95;flex:0 0 auto;white-space:nowrap}
  .avatar{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700}

  .pc-body{display:flex;min-height:820px}
  .subnav{
    width:150px;flex:0 0 150px;border-right:1px solid #e8e8e8;background:#fff;padding-top:2px;
  }
  .subnav a{
    display:block;font-size:12.5px;color:#555;text-decoration:none;padding:13px 16px;
    border-bottom:1px solid #f2f2f2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .subnav a:hover{background:#f2f8ff;color:var(--blue)}
  .subnav a.on{background:var(--sub);color:#333;font-weight:600}
  .content{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
  .crumbbar{
    height:40px;flex:0 0 40px;background:var(--crumb);display:flex;align-items:center;
    padding:0 22px;font-size:12px;color:#7b8a99;gap:6px;
  }
  .crumbbar .sep{color:#b8c4cf;margin:0 2px}
  .crumbbar .cur{color:var(--blue)}
  .page{padding:26px 22px 40px;flex:1}

  /* ---------- 搜索区 ---------- */
  .filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .field{
    width:190px;height:40px;border:1px solid #e2e2e2;border-radius:3px;background:#fff;
    font-size:12px;color:#333;padding:0 10px;font-family:inherit;text-align:center;
  }
  .field::placeholder{color:#b9b9b9}
  .field:focus{outline:none;border-color:var(--blue)}
  .field.date{text-align:left;color:#b9b9b9;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .btn{
    height:36px;padding:0 20px;border:0;border-radius:3px;background:var(--blue);color:#fff;
    font-size:12px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{background:#0c84f0}
  .btn + .btn{margin-left:10px}

  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th{
    background:var(--thead);font-weight:400;font-size:12px;color:#333;height:40px;
    border:1px solid var(--line);padding:6px 8px;
  }
  td{
    border:1px solid var(--line);font-size:12px;color:#555;text-align:center;
    padding:10px 8px;line-height:1.6;word-break:break-word;
  }
  tbody tr:hover td{background:#fafcff}
  td.l{text-align:left}
  .link{color:var(--blue);cursor:pointer;font-size:12px}
  .link:hover{text-decoration:underline}
  .ops{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;line-height:1.5}
  .num-neg{color:#e5484d}
  .spec{font-size:11px;color:#777;text-align:left;line-height:1.75}

  .pager{
    display:flex;align-items:center;justify-content:flex-end;gap:8px;
    margin-top:18px;font-size:12px;color:#666;
  }
  .pg{
    min-width:22px;height:22px;border:1px solid #ddd;border-radius:3px;display:grid;place-items:center;
    font-size:11px;color:#666;cursor:pointer;padding:0 5px;background:#fff;
  }
  .pg:hover{border-color:var(--blue);color:var(--blue)}
  .pg.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* ---------- 注释框 ---------- */
  .note{
    margin-top:26px;background:#e6f4fd;border-left:3px solid var(--blue);border-radius:4px;
    padding:16px 18px;font-size:12px;color:#2b5570;line-height:1.95;
  }
  .note b{display:block;margin-bottom:4px;color:#17496b;font-size:12.5px}

  /* ---------- 详情页 ---------- */
  .detail-hd{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .back{
    width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:#333;font-size:16px;
  }
  .back:hover{color:var(--blue)}
  .detail-hd h2{font-size:15px;font-weight:700;color:#222}
  .panel{
    border:1px solid #eef1f4;background:#fff;padding:22px 26px 26px;margin-bottom:20px;
  }
  .panel-title{
    position:relative;padding-left:11px;font-size:13.5px;font-weight:700;color:#222;margin-bottom:20px;
  }
  .panel-title::before{
    content:"";position:absolute;left:0;top:1px;width:3px;height:14px;background:var(--blue);border-radius:1px;
  }
  .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 16px}
  .kv .item{font-size:12px;display:flex;gap:6px;min-width:0}
  .kv .k{color:#7d8792;flex:0 0 auto}
  .kv .v{color:#222;font-weight:500;word-break:break-all}
  .panel table{margin-top:4px}
  .stamp{color:#e5484d}

  /* ---------- 登录 ---------- */
  .login-wrap{width:1280px;max-width:100%;height:760px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 28px rgba(28,50,80,.14)}
  .login-card{display:flex;width:760px;max-width:100%;height:470px;background:#fff;box-shadow:0 4px 30px rgba(30,80,140,.12);border-radius:4px;overflow:hidden}
  .login-left{
    width:340px;background:#e9f3fd;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px 26px;
  }
  .login-left h3{font-size:17px;font-weight:700;color:#2b4a63;letter-spacing:.5px}
  .login-left p{font-size:10.5px;color:#7f9cb4;margin-top:6px;letter-spacing:.2px}
  .login-art{margin-top:34px;width:250px;height:170px;position:relative}
  .login-right{flex:1;padding:46px 42px}
  .login-right h4{font-size:13.5px;font-weight:700;color:#222}
  .login-right h4 span{font-weight:400;font-size:11px;color:#9aa4af}
  .login-form{margin-top:26px}
  .login-form input{
    width:100%;height:42px;border:1px solid #e4e4e4;border-radius:3px;padding:0 14px;
    font-size:12px;font-family:inherit;margin-bottom:14px;color:#333;
  }
  .login-form input::placeholder{color:#bbb}
  .login-form input:focus{outline:none;border-color:var(--blue)}
  .captcha-row{display:flex;gap:10px}
  .captcha-row input{margin-bottom:0;flex:1}
  .captcha-box{
    width:82px;height:42px;border:1px solid #e4e4e4;border-radius:3px;display:grid;place-items:center;
    font-size:16px;font-style:italic;letter-spacing:1px;color:#4b5b6a;font-family:Georgia,serif;
    background:linear-gradient(120deg,#fdfdfd,#f1f4f7);user-select:none;
  }
  .login-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#7b8794;margin:16px 0 20px}
  .login-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .login-row a{color:var(--blue);text-decoration:none}
  .login-submit{
    width:100%;height:44px;border:0;border-radius:3px;background:var(--blue);color:#fff;
    font-size:14px;letter-spacing:2px;cursor:pointer;font-family:inherit;
  }
  .login-submit:hover{background:#0c84f0}

  /* ---------- APP ---------- */
  .phone{
    width:375px;height:760px;background:#fff;border-radius:26px;position:relative;
    box-shadow:0 10px 36px rgba(28,50,80,.18);overflow:hidden;display:flex;flex-direction:column;
    border:1px solid #e2e6ea;
  }
  .status{
    height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;font-size:11px;font-weight:600;color:#111;
  }
  .app-hd{
    height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:center;position:relative;
    font-size:15px;font-weight:600;color:#222;border-bottom:1px solid #f0f0f0;
  }
  .app-hd .l{position:absolute;left:14px;font-size:18px;color:#333;cursor:pointer;line-height:1}
  .app-hd .r{position:absolute;right:14px;font-size:12px;color:var(--blue);font-weight:400}
  .app-body{flex:1;overflow:auto;padding:18px 16px 20px;background:#fff}
  .app-grp{margin-bottom:22px}
  .app-grp h5{font-size:13.5px;font-weight:700;color:#1d2b38;margin-bottom:14px}
  .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
  .app-grid .cell{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .app-grid .cell:hover .ic{background:#e6f2fe}
  .ic{
    width:44px;height:44px;border-radius:10px;background:#f4f8fc;display:grid;place-items:center;
    transition:background .15s;
  }
  .ic svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .app-grid .cell span{font-size:11px;color:#3c4a57;text-align:center;line-height:1.3}
  .tabbar{
    height:54px;flex:0 0 54px;border-top:1px solid #eee;display:flex;background:#fff;
  }
  .tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#9aa4af}
  .tabbar div.on{color:var(--blue)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .app-card{
    border:1px solid #eef1f4;border-radius:6px;padding:14px 14px 10px;margin-bottom:12px;background:#fff;
  }
  .app-card .hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid #f2f4f6;margin-bottom:10px}
  .app-card .hd b{font-size:12.5px;color:#1d2b38}
  .app-card .hd i{font-style:normal;font-size:11px;color:var(--blue)}
  .app-card .row{display:flex;font-size:12px;color:#5b6874;line-height:2.05}
  .app-card .row .k{color:#8b96a2;width:74px;flex:0 0 74px}
  .app-card .row .v{color:#22303c}
  .app-meta{display:flex;gap:18px;font-size:11.5px;color:#7b8794;margin-top:10px;padding-top:10px;border-top:1px solid #f2f4f6;align-items:center}
  .app-meta .m{display:flex;align-items:center;gap:5px}
  .app-meta svg{width:14px;height:14px;stroke:#9aa4af;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- AI 建议层 ---------- */
  .ai-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    color:#0b6ed6;background:#e8f2ff;border-radius:3px;padding:2px 7px;letter-spacing:.3px;
  }
  .ai-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:#1891ff;box-shadow:0 0 0 3px rgba(24,145,255,.15)}
  .ai-card{
    border:1px solid #d3e6fa;border-radius:10px;
    background:linear-gradient(180deg,#fafdff 0%,#fff 55%);
    box-shadow:0 6px 20px rgba(24,145,255,.10);padding:16px 18px;
  }
  .ai-card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .ai-card .hl{font-size:13.5px;font-weight:700;color:#12324a}
  .conf{font-size:10.5px;font-weight:600;color:#12854a;background:#e6f8ef;border-radius:20px;padding:3px 9px;white-space:nowrap}
  .conf.mid{color:#a8730f;background:#fdf4e3}
  .loc-big{
    font-size:30px;font-weight:800;color:#0b6ed6;letter-spacing:1.5px;line-height:1.1;
    font-family:"DIN Alternate","Bahnschrift",Arial,sans-serif;
  }
  .loc-sub{font-size:11.5px;color:#8494a3;margin-top:5px}
  .reasons{list-style:none;margin:12px 0 16px;display:flex;flex-direction:column;gap:7px}
  .reasons li{font-size:12px;color:#42566a;line-height:1.6;display:flex;gap:8px;align-items:flex-start}
  .reasons li::before{content:"";width:4px;height:4px;border-radius:50%;background:#1891ff;margin-top:7px;flex:0 0 4px}
  .ai-actions{display:flex;gap:8px;flex-wrap:wrap}
  .ai-btn{
    height:34px;padding:0 16px;border-radius:6px;font-size:12.5px;border:1px solid #d3e6fa;
    background:#fff;color:#0b6ed6;cursor:pointer;font-family:inherit;
  }
  .ai-btn:hover{background:#f2f8ff}
  .ai-btn.primary{background:#1891ff;border-color:#1891ff;color:#fff}
  .ai-btn.primary:hover{background:#0c84f0}
  .ai-btn.ghost{border-color:#e6e9ed;color:#8b96a2}
  .ai-foot{font-size:11px;color:#9aa8b5;margin-top:12px;line-height:1.7}

  .check{border:1px solid #e6ebf1;border-radius:10px;overflow:hidden;background:#fff}
  .check-hd{padding:14px 20px;background:#f7fafd;border-bottom:1px solid #eef2f6;display:flex;align-items:center;justify-content:space-between}
  .check-hd b{font-size:13px;color:#1d2b38}
  .check-hd .sum{font-size:12px;color:#5b6874}
  .check-hd .sum i{font-style:normal;color:#12854a;font-weight:600}
  .check-hd .sum u{text-decoration:none;color:#c08a12;font-weight:600}
  .check-item{display:flex;gap:12px;padding:15px 20px;border-bottom:1px solid #f2f5f8;font-size:12px;align-items:flex-start}
  .check-item:last-child{border-bottom:0}
  .check-item .ico{width:16px;flex:0 0 16px;font-size:13px;line-height:1.5;text-align:center}
  .check-item .body{flex:1;min-width:0}
  .check-item .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .check-item .row1 b{font-size:12.5px;color:#1d2b38;font-weight:600}
  .check-item .code{font-size:10.5px;color:#93a1ae;background:#f4f6f8;border-radius:3px;padding:1px 5px}
  .check-item .desc{color:#6b7a88;line-height:1.75}
  .check-item .act{margin-top:7px;display:flex;gap:14px}
  .ico.ok{color:#17a34a}.ico.warn{color:#e0a417}.ico.block{color:#e5484d}
  .check-ft{padding:14px 20px;background:#fcfdfe;border-top:1px solid #f2f5f8;display:flex;justify-content:flex-end;gap:10px}

  .ask-wrap{max-width:880px;margin:0 auto}
  .ask-hd{margin-bottom:22px}
  .ask-hd h1{font-size:19px;font-weight:700;color:#16283a;letter-spacing:.5px}
  .ask-hd p{font-size:12.5px;color:#8b96a2;margin-top:6px}
  .ask-box{
    display:flex;align-items:center;gap:12px;border:1px solid #d3e6fa;border-radius:10px;
    padding:0 8px 0 18px;height:54px;background:#fff;box-shadow:0 4px 16px rgba(24,145,255,.08);
  }
  .ask-box input{flex:1;border:0;outline:none;font-size:14px;color:#1d2b38;font-family:inherit;background:transparent}
  .ask-box input::placeholder{color:#b0bcc8}
  .ask-send{height:38px;padding:0 20px;border:0;border-radius:7px;background:#1891ff;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:12px;padding:7px 13px;border:1px solid #e6ebf1;border-radius:16px;color:#5b6874;background:#fff;cursor:pointer}
  .chip:hover{border-color:#bcdcfb;color:#0b6ed6;background:#f7fbff}
  .answer{margin-top:26px;border:1px solid #e6ebf1;border-radius:12px;background:#fff;box-shadow:0 4px 18px rgba(28,50,80,.06);overflow:hidden}
  .answer-hd{padding:18px 22px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:#8b96a2}
  .concl{padding:10px 22px 18px;font-size:16px;color:#16283a;line-height:1.7;font-weight:600}
  .concl em{font-style:normal;color:#0b6ed6;font-size:20px;font-weight:800;padding:0 2px}
  .chart{padding:6px 22px 18px}
  .bars{display:flex;align-items:flex-end;gap:26px;height:150px;padding:0 4px;border-bottom:1px solid #eef2f6}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
  .bar i{display:block;width:100%;max-width:36px;background:linear-gradient(180deg,#5db4ff,#1891ff);border-radius:4px 4px 0 0}
  .bar span{font-size:10.5px;color:#93a1ae}
  .bar b{font-size:10.5px;color:#5b6874;font-weight:600}
  .answer-tb{padding:0 22px 8px}
  .answer-tb table{font-size:12px}
  .answer-tb th{height:34px;background:#fafcfd}
  .answer-tb td{height:36px;padding:6px 8px}
  .caliber{padding:12px 22px 16px;font-size:11.5px;color:#8b96a2;line-height:1.9;border-top:1px dashed #eef2f6}
  .caliber b{color:#5b6874;font-weight:600}
  .answer-ft{padding:12px 22px;background:#fbfcfe;border-top:1px solid #f2f5f8;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#9aa8b5}
  .answer-ft .ops{display:flex;gap:16px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .kpi{border:1px solid #eef1f4;border-radius:10px;padding:18px 20px;background:#fff}
  .kpi .k{font-size:12px;color:#8b96a2}
  .kpi .v{font-size:26px;font-weight:800;color:#16283a;margin:8px 0 4px;letter-spacing:.5px}
  .kpi .d{font-size:11px;color:#17a34a}
  .kpi .d.warn{color:#c08a12}
  .hbar .row{display:grid;grid-template-columns:104px 1fr 48px;align-items:center;gap:12px;font-size:12px;color:#5b6874;margin-bottom:14px}
  .hbar .row .nm{color:#42566a;font-size:11.5px}
  .hbar .row .track{display:block;flex:1;height:8px;background:#f1f5f9;border-radius:6px;overflow:hidden}

/* =========================================================

function topbar(group){
  const nav = NAV.map((g,i)=>{
    if (g.label === '仓储APP端'){
      return `<a class="${group===i?'on':''}" data-app="APP 主页" style="margin-left:38px">仓储APP端</a>`;
    }
    return `<a class="${group===i?'on':''}" data-group="${i}">${g.label}</a>`;
  }).join('');
  return `<header class="topbar">
    <div class="logo">WMS管理系统</div>
    <nav class="mainnav">${nav}</nav>
    <div class="right"><div class="avatar">王</div></div>
  </header>`;
}
function subnav(group, cur){
  const g = NAV[group];
  return `<aside class="subnav">${g.items.map(it=>`<a class="${it===cur?'on':''}" data-page="${it}">${it}</a>`).join('')}</aside>`;
}
function crumb(parts){
  return `<div class="crumbbar">${parts.map((p,i)=>
    i===parts.length-1 ? `<span class="cur">${p}</span>` : `<span>${p}</span><span class="sep">/</span>`
  ).join('')}</div>`;
}
function pager(){
  return `<div class="pager"><span>总共 85 个项目</span>
    <span class="pg">‹</span>
    <span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">4</span><span class="pg">5</span>
    <span class="pg">›</span></div>`;
}
/* 列宽归一化：保证 fixed 布局下铺满整行 */
function norm(cols){
  const total = cols.reduce((s,c)=>s + parseFloat(c[1]), 0);
  if (!total) return cols;
  const out = cols.map(c=>[c[0], (parseFloat(c[1]) / total * 100).toFixed(2) + '%']);
  return out;
}
function note(title, lines){
  return `<div class="note"><b>${title}</b>${lines.map(l=>`<div>${l}</div>`).join('')}</div>`;
}

/* 通用列表页 */
function listPage(cfg){
  const filters = cfg.filters.map(f=>{
    if (f.type === 'date') return `<div class="field date"><span>${f.ph}</span><span>▯</span></div>`;
    if (f.type === 'select') return `<div class="field date"><span>${f.ph}</span><span>▾</span></div>`;
    return `<input class="field" placeholder="${f.ph}">`;
  }).join('');
  const actions = `<button class="btn">${cfg.btn || '查询'}</button>` +
    (cfg.actions||[]).map(a=>`<button class="btn">${a}</button>`).join('');

  const head = norm(cfg.cols).map(c=>`<th style="width:${c[1]}">${c[0]}</th>`).join('');
  const body = cfg.rows.map(r=>`<tr>${r.map(cell=>{
    if (cell && cell.t === 'link') return `<td><div class="ops">${cell.v.map(x=>`<span class="link">${x}</span>`).join('')}</div></td>`;
    if (cell && cell.t === 'neg') return `<td><span class="num-neg">${cell.v}</span></td>`;
    if (cell && cell.t === 'spec') return `<td><div class="spec">${cell.v}</div></td>`;
    if (cell && cell.t === 'tag') return `<td><span style="color:${cell.c}">${cell.v}</span></td>`;
    if (cell && cell.t === 'switch')
      return `<td><span style="display:inline-block;width:38px;height:20px;border-radius:12px;background:${cell.on?'#1891ff':'#d7dde3'};position:relative"><i style="position:absolute;top:2px;${cell.on?'right:2px':'left:2px'};width:16px;height:16px;border-radius:50%;background:#fff;display:block"></i></span></td>`;
    return `<td>${cell ?? ''}</td>`;
  }).join('')}</tr>`).join('');

  return `<div class="pc">
    ${topbar(cfg.group)}
    <div class="pc-body">
      ${subnav(cfg.group, cfg.sub)}
      <section class="content">
        ${crumb(cfg.crumb)}
        <div class="page">
          <div class="filters">${filters}${actions}</div>
          <table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
          ${pager()}
          ${cfg.note || ''}
        </div>
      </section>
    </div>
  </div>`;
}

/* 详情页 */
function detailPage(cfg){
  const secs = cfg.sections.map(s=>{
    let inner = '';
    if (s.kv){
      inner = `<div class="kv">${s.kv.map(([k,v])=>{
        const isStamp = String(v).includes('待') || String(v).includes('未');
        return `<div class="item"><span class="k">${k}：</span><span class="v" ${isStamp?'style="color:#1891ff"':''}>${v}</span></div>`;
      }).join('')}</div>`;
    }
    if (s.table){
      const head = norm(s.table.cols).map(c=>`<th style="width:${c[1]}">${c[0]}</th>`).join('');
      const body = s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
      inner = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }
    return `<div class="panel"><div class="panel-title">${s.title}${s.badge?`<span class="ai-tag" style="margin-left:8px;vertical-align:1px">${s.badge}</span>`:''}</div>${inner}</div>`;
  }).join('');

  const act = cfg.action ? `<div style="margin-left:auto;display:flex;align-items:center;gap:12px">
      ${cfg.action.hint?`<span style="font-size:11.5px;color:#9aa8b5">${cfg.action.hint}</span>`:''}
      <button class="btn" data-page="${cfg.action.to}">${cfg.action.text}</button>
    </div>` : '';

  return `<div class="pc">
    ${topbar(cfg.group)}
    <div class="pc-body">
      ${subnav(cfg.group, cfg.sub)}
      <section class="content">
        ${crumb(cfg.crumb)}
        <div class="page">
          <div class="detail-hd"><span class="back" data-page="${cfg.backTo||''}">←</span><h2>${cfg.title}</h2>${act}</div>
          ${secs}
        </div>
      </section>
    </div>
  </div>`;
}

    <div class="app-hd">
      ${back ? '<span class="l" data-page="'+back+'">‹</span>' : ''}
      <span>${title}</span>
      ${right ? '<span class="r">'+right+'</span>' : ''}
    </div>
    <div class="app-body">${body}</div>
    ${tab ? `<div class="tabbar">
      <div class="${tab==='home'?'on':''}">${svg('home')}<span>工作台</span></div>
      <div class="${tab==='me'?'on':''}">${svg('user')}<span>我的</span></div>
    </div>` : ''}

/* 登录页放在最前面 */
const ORDER = ['登录页面',
  '成品库存明细','物料库存明细',
  '产品出入库查询','物料出入库查询',
  '产品入库','采购入库','生产退料','盘盈入库','入库详情',
  '销售出库','领料出库','盘亏出库','出库详情',
  '来料检验','物料盘点','盘点详情','物料移位',
  '仓库管理','库位管理','条码管理',
  '智能问数','库位推荐（APP）','拣货路径（APP）','提交前校验','AI 效果看板',
  'APP 主页','APP 产品入库','APP 产品入库详情','APP 采购入库','APP 来料验收',
  'APP 入库作业','APP 出库作业','APP 库内作业'
];

/* =========================================================
   渲染与交互
   ========================================================= */
let current = '登录页面';
const closed = new Set();

function buildTree(){
  let html = '';
  html += `<div class="node lv2 ${current==='登录页面'?'active':''}" data-page="登录页面" style="padding-left:14px">登录页面</div>`;

  NAV.forEach((g, gi)=>{
    const isClosed = closed.has(gi);
    html += `<div class="node lv1 ${isClosed?'closed':''}" data-grp="${gi}"><span class="tri">▼</span>${g.label}</div>`;
    html += `<div class="grp-body ${isClosed?'hide':''}" data-body="${gi}">`;
    g.items.forEach(it=>{
      if (!PAGES[it]) return;
      html += `<div class="node lv2 ${current===it?'active':''}" data-page="${it}">${it}</div>`;
    });
    html += `</div>`;
  });
  $('#tree').innerHTML = html;
  $('#pcount').textContent = ORDER.length + ' 屏';
}

function render(){
  const page = PAGES[current];
  if (!page) return;
  $('#stageTitle').innerHTML = `${current}<span>${page.app ? '移动端' : 'PC 端'}</span>`;
  $('#stageBody').innerHTML = page.render();
  buildTree();
  $('#stageBody').scrollTop = 0;
}

function go(name){
  if (!PAGES[name]) return;
  current = name;
  history.replaceState(null, '', '#' + encodeURIComponent(name));
  render();
}

document.addEventListener('click', e=>{
  const grp = e.target.closest('[data-grp]');
  if (grp){
    const gi = +grp.dataset.grp;
    closed.has(gi) ? closed.delete(gi) : closed.add(gi);
    grp.classList.toggle('closed');
    const body = document.querySelector(`[data-body="${gi}"]`);
    if (body) body.classList.toggle('hide');
    return;
  }
  const gbtn = e.target.closest('[data-group]');
  if (gbtn){
    const gi = +gbtn.dataset.group;
    const first = NAV[gi].items.find(i=>PAGES[i]);
    if (first) go(first);
    return;
  }
  const app = e.target.closest('[data-app]');
  if (app){ go(app.dataset.app); return; }

  const ct = e.target.closest('[data-ct]');
  if (ct){
    const key = ct.dataset.ct;
    document.querySelectorAll('[data-ct]').forEach(t=>t.classList.toggle('on', t===ct));
    document.querySelectorAll('[data-pane]').forEach(p=>{ p.hidden = p.dataset.pane !== key; });
    return;
  }

  const p = e.target.closest('[data-page]');
  if (p && PAGES[p.dataset.page]){ go(p.dataset.page); return; }

  // 表格里的"入库详情/出库详情/盘点详情"链接
  const link = e.target.closest('.link');
  if (link){
    const t = link.textContent;
    if (t.includes('入库详情')) go('入库详情');
    else if (t.includes('出库详情')) go('出库详情');
    else if (t.includes('盘点详情')) go('盘点详情');
  }
});

document.addEventListener('keydown', e=>{
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const i = ORDER.indexOf(current);
  const n = e.key === 'ArrowRight' ? (i+1) % ORDER.length : (i-1+ORDER.length) % ORDER.length;
  go(ORDER[n]);
});

window.addEventListener('hashchange', ()=>{
  const n = decodeURIComponent(location.hash.slice(1));
  if (PAGES[n] && n !== current){ current = n; render(); }
});

const init = decodeURIComponent(location.hash.slice(1));
if (PAGES[init]) current = init;
render();
</script>
