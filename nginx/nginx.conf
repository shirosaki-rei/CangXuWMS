server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx 只在「配置加载时」解析一次 upstream 域名并永久缓存。api 容器重建后
    # IP 变了，它仍连旧 IP，表现为 502 + error.log 里 connect() failed (111) 到旧地址。
    # 用 Docker 内置 DNS + 变量形式 proxy_pass，让它在 TTL 到期后自己重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 前端 history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源带 hash，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # 用变量时 nginx 不再做 location 前缀替换，必须自己带上 $request_uri（含 query）
        proxy_pass         $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Trace-Id        $http_x_trace_id;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
        access_log off;
    }

    location = /metrics {
        proxy_pass $api_upstream/metrics;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
